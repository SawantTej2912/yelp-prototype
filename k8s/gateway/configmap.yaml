apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx-config
  namespace: yelp-prototype
data:
  default.conf: |
    upstream user_service {
        server user-service:8001;
    }
    upstream restaurant_service {
        server restaurant-service:8002;
    }
    upstream review_service {
        server review-service:8003;
    }
    upstream owner_service {
        server owner-service:8004;
    }

    upstream user_uploads {
        server user-service:8001;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 25M;

        location /docs { proxy_pass http://user_service; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /redoc { proxy_pass http://user_service; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /openapi.json { proxy_pass http://user_service; proxy_http_version 1.1; proxy_set_header Host $host; }

        location ~ ^/restaurants/[0-9]+/claim$ {
            proxy_pass http://owner_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth {
            proxy_pass http://user_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /users {
            proxy_pass http://user_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /ai-assistant {
            proxy_pass http://user_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /uploads/ {
            proxy_pass http://user_uploads;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /restaurants {
            proxy_pass http://restaurant_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /owner {
            proxy_pass http://owner_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /reviews {
            proxy_pass http://review_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /favorites {
            proxy_pass http://review_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
